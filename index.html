<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>庫存記帳 - Mini App 展示</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --tg-blue:#2AABEE;
    --tg-blue-dark:#229ED9;
    --bg:#EFEFF4;
    --card:#FFFFFF;
    --text:#1c1c1e;
    --sub:#8e8e93;
    --line:#e3e3e8;
    --danger:#ff3b30;
    --good:#34c759;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:24px 12px;
  }
  .phone{
    width:100%;
    max-width:420px;
  }
  .topbar{
    background:linear-gradient(180deg,var(--tg-blue),var(--tg-blue-dark));
    color:white;
    padding:16px 18px;
    border-radius:16px 16px 0 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar h1{
    font-size:17px;
    margin:0;
    font-weight:600;
  }
  .topbar span{
    font-size:12px;
    opacity:.85;
  }
  .topbar a.switch-link{
    color:white;
    font-size:12px;
    text-decoration:underline;
    opacity:.9;
  }
  .list{
    background:var(--card);
    border-radius:0 0 16px 16px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row.header{
    background:#fafafa;
    color:var(--sub);
    font-size:12px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .col-name{flex:1; min-width:0;}
  .col-qty{width:56px;}
  .col-plus, .col-minus, .col-delete{
    width:32px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  input.qty-input{
    width:100%;
    border:none;
    background:transparent;
    font-size:16px;
    font-weight:600;
    color:var(--text);
    text-align:center;
    padding:4px 2px;
    border-radius:6px;
    -moz-appearance:textfield;
  }
  input.qty-input::-webkit-outer-spin-button,
  input.qty-input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  input.qty-input:focus{
    outline:none;
    background:#f2f6fb;
  }
  button.stepper.delete{
    background:rgba(142,142,147,.12);
    color:var(--sub);
    font-size:14px;
  }
  input.name-input{
    width:100%;
    border:none;
    background:transparent;
    font-size:15px;
    font-weight:500;
    color:var(--text);
    padding:4px 2px;
    border-radius:6px;
  }
  input.name-input:focus{
    outline:none;
    background:#f2f6fb;
  }
  button.stepper{
    width:32px;
    height:32px;
    border-radius:10px;
    border:none;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .08s ease;
  }
  button.stepper:active{ transform:scale(.9); }
  button.plus{ background:rgba(52,199,89,.12); color:var(--good); }
  button.minus{ background:rgba(255,59,48,.12); color:var(--danger); }
  .qty-flash{
    animation:flash .3s ease;
  }
  @keyframes flash{
    0%{ color:var(--tg-blue); transform:scale(1.25); }
    100%{ color:var(--text); transform:scale(1); }
  }
  .add-row{
    display:flex;
    justify-content:center;
    padding:14px;
  }
  .add-btn{
    border:none;
    background:var(--tg-blue);
    color:white;
    padding:10px 18px;
    border-radius:20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .add-btn:active{ opacity:.8; }
  .footnote{
    text-align:center;
    color:var(--sub);
    font-size:11px;
    margin-top:10px;
  }
  .log-card{
    background:var(--card);
    border-radius:16px;
    margin-top:14px;
    padding:12px 14px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  .log-card h2{
    font-size:13px;
    margin:0 0 8px;
    color:var(--sub);
    font-weight:600;
  }
  .log-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .log-row:last-child{ border-bottom:none; }
  .log-row .log-time{ color:var(--danger); font-variant-numeric:tabular-nums; }
  .log-empty{ color:var(--sub); font-size:13px; padding:4px 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <h1>📦 庫存記帳</h1>
    <a class="switch-link" href="sales.html">💱 代儲記帳</a>
  </div>
  <div class="list" id="list">
    <div class="row header">
      <div class="col-plus"></div>
      <div class="col-name">名稱</div>
      <div class="col-qty">數量</div>
      <div class="col-minus"></div>
      <div class="col-delete"></div>
    </div>
    <!-- rows injected by JS -->
  </div>
  <div class="add-row">
    <button class="add-btn" onclick="addItem()">＋ 新增項目</button>
  </div>
  <div class="log-card">
    <h2>🕓 扣減紀錄</h2>
    <div id="logList"></div>
  </div>
  <div class="footnote">名稱與數量都可直接點擊輸入・按 🗑 可刪除項目・資料即時同步到後端</div>
</div>

<script>
// 部署後端後，把這裡換成你的 Render 網址，例如：
// const BACKEND_URL = 'https://sada-ledger-api.onrender.com';
const BACKEND_URL = 'https://ada-ledger-api.onrender.com';

let items = [];
let log = [];
let useBackend = true;
let nextLocalId = 1;

async function loadState(){
  try{
    const res = await fetch(`${BACKEND_URL}/api/items`);
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    items = data.items;
    log = data.log;
    useBackend = true;
  }catch(err){
    // 連不到後端（例如還沒部署、或 BACKEND_URL 還是預留位置）
    // 自動切換成本地展示模式，方便先看畫面跟操作手感
    useBackend = false;
    items = [
      { id: 'local-1', name: '東西1', qty: 10 },
      { id: 'local-2', name: '東西2', qty: 9 },
      { id: 'local-3', name: '東西3', qty: 8 },
    ];
    log = [];
    document.getElementById('list').insertAdjacentHTML('beforebegin',
      '<div class="log-card" style="margin-bottom:14px;"><div class="log-empty">⚠️ 尚未連上後端，目前是本地展示模式，操作不會保存。部署好後端並填入 BACKEND_URL 後會自動改為即時同步。</div></div>');
  }
  render();
  renderLog();
}

function render(){
  const list = document.getElementById('list');
  list.querySelectorAll('.item-row').forEach(el => el.remove());

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row item-row';
    row.innerHTML = `
      <div class="col-plus">
        <button class="stepper plus" onclick="changeQty('${item.id}', 1)">＋</button>
      </div>
      <div class="col-name">
        <input class="name-input" value="${item.name}" data-id="${item.id}" onchange="renameItem('${item.id}', this.value)">
      </div>
      <div class="col-qty">
        <input class="qty-input" id="qty-${item.id}" type="number" value="${item.qty}" onchange="setQty('${item.id}', this.value)">
      </div>
      <div class="col-minus">
        <button class="stepper minus" onclick="changeQty('${item.id}', -1)">－</button>
      </div>
      <div class="col-delete">
        <button class="stepper delete" onclick="deleteItem('${item.id}', '${item.name.replace(/'/g, "\\'")}')">🗑</button>
      </div>
    `;
    list.appendChild(row);
  });
}

async function changeQty(id, delta){
  const el = document.getElementById('qty-' + id);
  el.classList.remove('qty-flash');
  void el.offsetWidth;
  el.classList.add('qty-flash');

  if(!useBackend){
    const item = items.find(i => i.id === id);
    if(!item) return;
    item.qty = Math.max(0, item.qty + delta);
    el.value = item.qty;
    if(delta < 0){
      const now = new Date();
      const time = now.toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
      log.unshift({ name: item.name, amount: Math.abs(delta), time });
      log = log.slice(0, 50);
      renderLog();
    }
    return;
  }

  try{
    const res = await fetch(`${BACKEND_URL}/api/items/${id}/adjust`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ delta })
    });
    const data = await res.json();
    items = data.items;
    log = data.log;
    const item = items.find(i => i.id === id);
    if(item) el.value = item.qty;
    renderLog();
  }catch(err){
    console.error(err);
  }
}

function renderLog(){
  const box = document.getElementById('logList');
  if(log.length === 0){
    box.innerHTML = '<div class="log-empty">尚無扣減紀錄</div>';
    return;
  }
  box.innerHTML = log.slice(0, 8).map(entry => `
    <div class="log-row">
      <span>${entry.name}</span>
      <span class="log-time">－${entry.amount || 1}・${entry.time}</span>
    </div>
  `).join('');
}

async function renameItem(id, value){
  if(!useBackend){
    const item = items.find(i => i.id === id);
    if(item) item.name = value;
    return;
  }
  try{
    const res = await fetch(`${BACKEND_URL}/api/items/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: value })
    });
    const data = await res.json();
    items = data.items;
  }catch(err){
    console.error(err);
  }
}

async function setQty(id, value){
  const qty = Math.max(0, parseInt(value, 10) || 0);
  if(!useBackend){
    const item = items.find(i => i.id === id);
    if(item) item.qty = qty;
    render();
    return;
  }
  try{
    const res = await fetch(`${BACKEND_URL}/api/items/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qty })
    });
    const data = await res.json();
    items = data.items;
    render();
  }catch(err){
    console.error(err);
  }
}

async function deleteItem(id, name){
  if(!confirm(`確定要刪除「${name}」嗎？這個動作無法復原。`)) return;

  if(!useBackend){
    items = items.filter(i => i.id !== id);
    render();
    return;
  }
  try{
    const res = await fetch(`${BACKEND_URL}/api/items/${id}`, { method: 'DELETE' });
    const data = await res.json();
    items = data.items;
    render();
  }catch(err){
    console.error(err);
  }
}

async function addItem(){
  if(!useBackend){
    items.push({ id: 'local-' + (++nextLocalId), name: '新項目' + nextLocalId, qty: 0 });
    render();
    return;
  }
  try{
    const res = await fetch(`${BACKEND_URL}/api/items`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: '新項目' })
    });
    const data = await res.json();
    items = data.items;
    render();
  }catch(err){
    console.error(err);
  }
}

loadState();

// Telegram WebApp 整合：只有在 TG 裡打開才會生效，一般瀏覽器預覽不受影響
if (window.Telegram && window.Telegram.WebApp) {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const applyTheme = () => {
    const p = tg.themeParams || {};
    if (p.bg_color) document.body.style.background = p.bg_color;
  };
  applyTheme();
  tg.onEvent('themeChanged', applyTheme);
}
</script>
</body>
</html>
